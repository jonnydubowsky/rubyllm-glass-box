name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "3.2" installs the newest 3.2.x on the runner. Gemfile accepts
        # anything >= 3.2.3.
        ruby: ["3.2", "3.4", "4.0"]
    env:
      GLASS_BOX_MODE: offline
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Offline test suite
        run: bundle exec rake test
